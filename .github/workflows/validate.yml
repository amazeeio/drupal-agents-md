name: Validate AGENTS.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint \
            --disable MD013 MD033 MD041 MD034 \
            -- \
            *.md \
            DDEV/AGENTS.md \
            Vanilla/AGENTS.md \
            Lagoon/AGENTS.md

      - name: Check markdown code fences
        run: |
          errors=0
          for file in DDEV/AGENTS.md Vanilla/AGENTS.md Lagoon/AGENTS.md; do
            # Count opening and closing fences
            opens=$(grep -c '^\s*```' "$file" || true)
            if [ $((opens % 2)) -ne 0 ]; then
              echo "ERROR: Unclosed code fence in $file (found $opens fence markers)"
              errors=$((errors + 1))
            else
              echo "OK: $file has balanced code fences ($opens markers)"
            fi
          done
          exit $errors

      - name: Validate YAML code blocks
        run: |
          errors=0
          for file in DDEV/AGENTS.md Vanilla/AGENTS.md Lagoon/AGENTS.md; do
            echo "Checking YAML blocks in $file..."
            # Extract YAML code blocks and validate them
            python3 -c "
          import re, sys, yaml
          content = open('$file').read()
          blocks = re.findall(r'\`\`\`yaml\n(.*?)\`\`\`', content, re.DOTALL)
          for i, block in enumerate(blocks):
            try:
              yaml.safe_load(block)
            except yaml.YAMLError as e:
              print(f'  ERROR in YAML block {i+1}: {e}')
              sys.exit(1)
          print(f'  OK: {len(blocks)} YAML blocks validated')
          " || errors=$((errors + 1))
          done
          exit $errors

      - name: Check internal links
        run: |
          errors=0
          for file in README.md CONTRIBUTING.md CHANGELOG.md; do
            if [ ! -f "$file" ]; then continue; fi
            echo "Checking links in $file..."
            # Check that local file references exist
            while IFS= read -r link; do
              target=$(echo "$link" | sed 's/\[.*\](\(.*\))/\1/' | cut -d'#' -f1)
              if [ -n "$target" ] && [ ! -f "$target" ]; then
                echo "  ERROR: Broken link '$target' in $file"
                errors=$((errors + 1))
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | grep -v 'http' || true)
          done
          exit $errors

      - name: Check all variants exist
        run: |
          for variant in DDEV Vanilla Lagoon; do
            if [ ! -f "$variant/AGENTS.md" ]; then
              echo "ERROR: Missing $variant/AGENTS.md"
              exit 1
            fi
            lines=$(wc -l < "$variant/AGENTS.md")
            echo "OK: $variant/AGENTS.md ($lines lines)"
          done

      - name: Check required sections
        run: |
          required_sections=(
            "## Table of Contents"
            "## Code Style and Standards"
            "## Anti-Patterns"
            "## Module Scaffolding Template"
            "## Testing"
          )
          errors=0
          for file in DDEV/AGENTS.md Vanilla/AGENTS.md Lagoon/AGENTS.md; do
            echo "Checking sections in $file..."
            for section in "${required_sections[@]}"; do
              if ! grep -q "$section" "$file"; then
                echo "  ERROR: Missing section '$section'"
                errors=$((errors + 1))
              fi
            done
            echo "  Section check complete"
          done
          exit $errors
